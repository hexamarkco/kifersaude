name: Autonomous V2 contextual care location validation
on:
  push:
    branches:
      - fix/v2-contextual-hospital-location-2026-11-18
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: V2 focused and Rose Mary regression tests
        run: npm test -- supabase/functions/_shared/__tests__/autonomous-v2.test.ts supabase/functions/_shared/__tests__/autonomous-v2-2026-11-17-regressions.test.ts supabase/functions/_shared/__tests__/autonomous-v2-worker.test.ts
      - name: Full offline V2 suite
        run: npm run test:autonomous-v2
