name: V2 resolved-need regression verification
on:
  push:
    branches:
      - fix/v2-customer-already-resolved-2026-11-18
permissions:
  contents: read
jobs:
  v2-resolved-need:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: V2 regression, handoff and worker tests
        run: npm test -- supabase/functions/_shared/__tests__/autonomous-v2-2026-11-17-regressions.test.ts supabase/functions/_shared/__tests__/autonomous-v2.test.ts supabase/functions/_shared/__tests__/autonomous-v2-worker.test.ts supabase/functions/_shared/__tests__/autonomous-attendance-handoff-contract.test.ts
      - name: Full offline V2 evaluation
        run: npm run test:autonomous-v2
