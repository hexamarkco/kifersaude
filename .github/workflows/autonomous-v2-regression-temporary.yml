name: Autonomous V2 regression verification (temporary)
on:
  push:
    branches:
      - fix/autonomous-qualification-2026-11-17
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Autonomous V2 tests
        run: npm test -- supabase/functions/_shared/__tests__/autonomous-v2-2026-11-17-regressions.test.ts supabase/functions/_shared/__tests__/autonomous-v2.test.ts supabase/functions/_shared/__tests__/autonomous-v2-worker.test.ts supabase/functions/_shared/__tests__/autonomous-v2-style.test.ts
      - name: TypeScript verification
        run: npm run typecheck
      - name: Lint verification
        run: npm run lint
