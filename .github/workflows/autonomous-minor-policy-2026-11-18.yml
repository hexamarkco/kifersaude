name: Minor qualification policy regression (RJ)
on:
  push:
    branches:
      - fix/autonomous-minor-rj-eligibility-2026-11-18
permissions:
  contents: read
jobs:
  autonomous-minors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Autonomous V2 regression
        run: npm test -- supabase/functions/_shared/__tests__/autonomous-v2-2026-11-17-regressions.test.ts supabase/functions/_shared/__tests__/autonomous-v2.test.ts supabase/functions/_shared/__tests__/autonomous-v2-worker.test.ts supabase/functions/_shared/__tests__/autonomous-v2-style.test.ts
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
