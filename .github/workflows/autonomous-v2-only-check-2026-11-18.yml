name: Autonomous V2 exclusive regression
on:
  push:
    branches:
      - refactor/autonomous-v2-only-remove-v1-2026-11-18
permissions:
  contents: read
jobs:
  autonomous-v2-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: V2 focused tests
        run: npm test -- supabase/functions/_shared/__tests__/autonomous-v2-worker.test.ts supabase/functions/_shared/__tests__/autonomous-v2-message-grouping.test.ts supabase/functions/_shared/__tests__/autonomous-v2-2026-11-17-regressions.test.ts supabase/functions/_shared/__tests__/autonomous-v2.test.ts supabase/functions/_shared/__tests__/ai-sandbox-attendance.test.ts supabase/functions/_shared/__tests__/autonomous-attendance-rebuild-contract.test.ts supabase/functions/_shared/__tests__/autonomous-attendance-handoff-contract.test.ts
